# Minimal smoke-test config for the dataset_test/ directory.
# Uses tiny image size, 1 epoch, resnet18 from scratch, CPU only,
# so the whole pipeline can run end-to-end in seconds.

dataset:
  data_root: "dataset_test"
  train_dir: "train"
  val_dir: "val"
  test_dir: "test"
  classes: ["normal", "pneumonia", "tuberculosis"]
  num_classes: 3
  image_size: 96
  batch_size: 4
  num_workers: 0
  pin_memory: false
  persistent_workers: false

model:
  name: "resnet18"
  pretrained: false
  num_classes: 3
  drop_path_rate: 0.0
  drop_rate: 0.0

training:
  epochs: 1
  optimizer:
    name: "adam"
    lr: 1e-3
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1e-8
  scheduler:
    name: "cosine_annealing"
    t_0: 1
    t_mult: 1
    eta_min: 0.0
    warmup_epochs: 0
    warmup_lr: 1e-6
  loss:
    name: "cross_entropy"
    label_smoothing: 0.0
  gradient_clip: 0.0
  mixed_precision: false
  early_stopping:
    patience: 100
    min_delta: 0.0
    mode: "max"
  save_best_only: true
  save_top_k: 1

augmentation:
  train:
    - name: "Resize"
      height: 96
      width: 96
    - name: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - name: "ToTensorV2"
  val:
    - name: "Resize"
      height: 96
      width: 96
    - name: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - name: "ToTensorV2"
  test:
    - name: "Resize"
      height: 96
      width: 96
    - name: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - name: "ToTensorV2"

logging:
  use_wandb: false
  wandb_project: "cxr-smoke"
  wandb_entity: null
  use_tensorboard: false
  log_dir: "logs/smoke"
  log_interval: 1
  save_dir: "outputs/smoke"
  save_interval: 1

evaluation:
  metrics: ["accuracy", "f1", "auc"]
  class_names: ["Normal", "Pneumonia", "Tuberculosis"]

hardware:
  device: "cpu"
  mixed_precision: false
  compile_model: false