# Chest X-Ray Classification - Configuration
# Dataset paths - UPDATE THIS PATH TO YOUR DATASET LOCATION
dataset:
  data_root: "/run/media/saqib/067E00563129A4C4/Chest X-Ray"
  train_dir: "train"
  val_dir: "val"
  test_dir: "test"
  classes: ["normal", "pneumonia", "tuberculosis"]
  num_classes: 3
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true

# Model configuration
model:
  name: "convnext_tiny"  # Options: convnext_tiny, convnext_small, efficientnet_b0, efficientnet_b3, resnet50, vit_tiny_patch16_224
  pretrained: false  # Set to false for fully offline training
  num_classes: 3
  drop_path_rate: 0.1
  drop_rate: 0.2

# Training configuration
training:
  epochs: 100
  optimizer:
    name: "adamw"
    lr: 1e-4
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 1e-8
  scheduler:
    name: "cosine_annealing_warm_restarts"
    t_0: 10
    t_mult: 2
    eta_min: 1e-6
    warmup_epochs: 5
    warmup_lr: 1e-6
  loss:
    name: "label_smoothing_cross_entropy"
    label_smoothing: 0.1
  gradient_clip: 1.0
  mixed_precision: true
  early_stopping:
    patience: 15
    min_delta: 1e-4
    mode: "max"
  save_best_only: true
  save_top_k: 3

# Augmentation configuration
augmentation:
  train:
    - name: "Resize"
      height: 256
      width: 256
    - name: "RandomCrop"
      height: 224
      width: 224
    - name: "HorizontalFlip"
      p: 0.5
    - name: "Rotate"
      limit: 15
      p: 0.5
    - name: "RandomBrightnessContrast"
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.5
    - name: "GaussNoise"
      std_range: [0.1, 0.2]
      p: 0.3
    - name: "CoarseDropout"
      num_holes_range: [1, 8]
      hole_height_range: [0.05, 0.15]
      hole_width_range: [0.05, 0.15]
      fill: "random_uniform"
      p: 0.3
    - name: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - name: "ToTensorV2"
  val:
    - name: "Resize"
      height: 224
      width: 224
    - name: "CenterCrop"
      height: 224
      width: 224
    - name: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - name: "ToTensorV2"
  test:
    - name: "Resize"
      height: 224
      width: 224
    - name: "CenterCrop"
      height: 224
      width: 224
    - name: "Normalize"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - name: "ToTensorV2"

# Logging and monitoring
logging:
  use_wandb: false  # Disabled for fully offline/local training
  wandb_project: "chestxray-csc"
  wandb_entity: null
  use_tensorboard: true  # Use TensorBoard (local, no account needed)
  log_dir: "logs"
  log_interval: 10
  save_dir: "outputs"
  save_interval: 1

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc", "confusion_matrix"]
  class_names: ["Normal", "Pneumonia", "Tuberculosis"]

# Hardware
hardware:
  device: "cpu"  # Will auto-detect: cuda, mps, cpu
  mixed_precision: true
  compile_model: false  # torch.compile (requires PyTorch 2.0+)